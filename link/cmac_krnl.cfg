# v++ --link configuration for the send / cmac / recv datapath on U50
# (xilinx_u50_gen3x16_xdma_5_202210_1). The platform's ULP BD exposes QSFP0
# via interface_ports `io_gt_qsfp_00` (gt_rtl) and `io_clk_qsfp_refclka_00`
# (diff_clock_rtl). CFGEN's --connectivity.sp only handles memory sptags,
# not GT resources, so the QSFP binding is done from link/post_sys_link.tcl
# via connect_bd_intf_net at BD level.

[connectivity]
# Kernel instances
nk = send:1:send_0
nk = recv:1:recv_0
nk = cmac_au50:1:cmac_0

# Stream connectivity
sc = send_0.out:cmac_0.s_axis        # Tx: send -> CMAC
sc = cmac_0.m_axis:recv_0.in         # Rx: CMAC -> recv

# AXI-MM memory bindings (different HBM channels to avoid contention)
sp = send_0.mem:HBM[0]
sp = recv_0.mem:HBM[1]

# CMAC lives on SLR1 alongside the QSFP0 GT quad (per platform metadata).
slr = cmac_0:SLR1

[advanced]
# Post-sys-link overlay: wire cmac_0's gt_serial_port / gt_refclk to the
# platform ULP BD's built-in QSFP0 interface_ports.
param = compiler.userPostSysLinkOverlayTcl=link/post_sys_link.tcl
